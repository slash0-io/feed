name: Publish feed

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if content is unchanged (e.g. first signed publish)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feed-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      public: ${{ steps.vis.outputs.public }}
      review: ${{ steps.diff.outputs.review }}
    steps:
      # Pages can't serve from a private repo (free plan), so skip deploys, not
      # builds, until the repo goes public.
      - name: Check repo visibility
        id: vis
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the browser used by rendered sources
        # A handful of vendors publish their ranges only into a client-rendered
        # page (see `render: chrome` in sources.yaml). Those services have no
        # previously published version on their first run, so a missing browser
        # would surface as a dropped service and block the whole publish. Fail
        # here instead, where the reason is obvious.
        run: |
          bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$bin" ]; then
            echo "::error::No Chrome or Chromium on the runner; sources with 'render: chrome' cannot be fetched."
            exit 1
          fi
          echo "SLASH0_CHROME=$bin" >> "$GITHUB_ENV"
          "$bin" --version
      - name: Build feed incrementally against the published version
        # Unchanged services republish byte-for-byte; mass removals are
        # quarantined with the last-good version still served. A quarantine
        # does NOT fail this step: the artifact stays complete and freezing
        # every service to protect one is worse. The needs-review job below
        # reports it after the deploy has gone out.
        # The checked-in changelog floor is merged in so history survives a
        # bad publish. GITHUB_TOKEN authenticates only the github service's
        # api.github.com/meta fetch (unauthenticated runner IPs get 403
        # rate limits).
        run: go run ./generator -out dist -previous https://feed.slash0.io/v1 -changelog-floor changelog-floor.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Detect content change
        id: diff
        run: |
          echo "changed=$(head -c5 dist/BUILD_CHANGED | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "review=$(tr -d '\n' < dist/NEEDS_REVIEW)" >> "$GITHUB_OUTPUT"
      # KMS-held signing key (non-exportable; sign-only OIDC role) writes
      # the only index signature; inert until the AWS_SIGN_ROLE_ARN repo
      # variable is set. Runs only on deploying builds: ECDSA signatures are
      # not deterministic, so re-signing an unchanged index would defeat
      # deploy-skipping.
      - name: Configure AWS credentials for signing
        if: (steps.diff.outputs.changed == 'true' || inputs.force_deploy) && steps.vis.outputs.public == 'true' && vars.AWS_SIGN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SIGN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Sign index with KMS
        if: (steps.diff.outputs.changed == 'true' || inputs.force_deploy) && steps.vis.outputs.public == 'true' && vars.AWS_SIGN_ROLE_ARN != ''
        run: |
          set -euo pipefail
          KEYID=$(aws kms get-public-key --key-id "${{ vars.FEED_KMS_KEY_ARN }}" \
            --query PublicKey --output text | openssl base64 -d -A | shasum -a 256 | cut -c1-8)
          openssl dgst -sha256 -binary dist/v1/index.json > index.digest
          SIG=$(aws kms sign --key-id "${{ vars.FEED_KMS_KEY_ARN }}" \
            --message fileb://index.digest --message-type DIGEST \
            --signing-algorithm ECDSA_SHA_256 --query Signature --output text)
          rm index.digest
          printf '%s:%s\n' "$KEYID" "$SIG" > dist/v1/index.json.sig
          echo "signed dist/v1/index.json with key $KEYID"
      - uses: actions/upload-pages-artifact@v3
        if: (steps.diff.outputs.changed == 'true' || inputs.force_deploy) && steps.vis.outputs.public == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: (needs.build.outputs.changed == 'true' || inputs.force_deploy) && needs.build.outputs.public == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs after the deploy so a quarantine is still loud without making the
  # whole feed stale. Fresh data ships first; then the run goes red.
  needs-review:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report quarantined or failed services
        # Passed via env rather than interpolated into the script body, so the
        # value can never be treated as shell.
        env:
          REVIEW: ${{ needs.build.outputs.review }}
        run: |
          set -- $REVIEW
          quarantined="${1:-0}"; failed="${2:-0}"
          if [ "$quarantined" -gt 0 ]; then
            echo "::error::$quarantined service(s) quarantined by the removal guardrail. Last-good versions are still serving. Review the build log, then either accept the change or fix the source."
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed service(s) failed to build and are serving their last-good version."
          fi
          if [ "$quarantined" -gt 0 ] || [ "$failed" -gt 0 ]; then
            exit 1
          fi
          echo "No services need review."
