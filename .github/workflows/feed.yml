name: Publish feed

on:
  # Cron disabled while the repo is private: GitHub Pages won't serve from a
  # private repo on the free plan. Re-enable at go-public — deploys are gated
  # on actual content change, so a tight cadence only costs the build job.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feed-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build feed incrementally against the published version
        # Unchanged services republish byte-for-byte; mass removals are
        # quarantined (nonzero exit) with the last-good version still served.
        run: go run ./generator -out dist -previous https://egresshq.github.io/feed/v1
      - name: Detect content change
        id: diff
        run: echo "changed=$(head -c5 dist/BUILD_CHANGED | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
