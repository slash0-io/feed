name: Publish feed

on:
  # Cron disabled while the repo is private: GitHub Pages won't serve from a
  # private repo on the free plan, so scheduled runs would fail and burn
  # Actions minutes. Re-enable at go-public.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feed-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build feed from live vendor endpoints
        run: go run ./generator -out dist
      # TODO: replace time-based publish with change-detection (only deploy
      # when the normalized range set differs from the currently published
      # feed) and the per-source poll cadences from sources.yaml.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
