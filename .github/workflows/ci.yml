name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # The feed must build offline from archived fixtures, which proves parsers
      # against real upstream bodies without network flakiness.
      - run: go run ./generator -fixtures testdata/fixtures -out /tmp/dist
