# ── Services that do NOT publish pinnable ranges ─────────────────────────────
# Verified vendor positions. These are surfaced in the feed as `pinnable: false`
# with the vendor's recommended alternative: the catalog covers what you cannot pin, too.
non_publishers:
  - slug: twilio
    name: Twilio (REST API + webhooks)
    evidence: https://help.twilio.com/articles/115015934048
    vendor_position: "IPs 'highly dynamic, and span a large range, so it's impractical to list each of them'; they recommend allowing outbound HTTPS to any *.twilio.com subdomain instead. SIP trunking IS pinnable, see the twilio-sip service."
  - slug: adyen
    name: Adyen
    evidence: https://help.adyen.com/knowledge/ecommerce-integrations/webhooks/what-ip-addresses-does-adyen-use-to-send-webhook-events
    vendor_position: "No IP list; allowlist out.adyen.com or resolve it via DNS hourly (their words)."
  - slug: sendgrid
    name: SendGrid (webhooks/parse)
    evidence: https://support.sendgrid.com/hc/en-us/articles/44375457225371
    vendor_position: "Dynamic cloud infra; use signed webhooks, not IP allowlists."
  - slug: slack
    name: Slack
    evidence: https://docs.slack.dev/concepts/security/
    vendor_position: "No published egress IPs; their allowlisting feature restricts YOUR IPs calling THEM."
  - slug: shopify
    name: Shopify (webhooks)
    evidence: https://shopify.dev/docs/apps/build/webhooks/verify-deliveries
    vendor_position: "Documents HMAC-SHA256 signature verification as the way to authenticate a webhook. The page does not mention source IPs, and no official range list was found as of the verified date."
  - slug: square
    name: Square (webhooks)
    evidence: https://developer.squareup.com/docs/webhooks/step3validate
    vendor_position: "No webhook source-IP list published; validate notifications via the documented HMAC-SHA256 signature flow."
  - slug: snowflake
    name: Snowflake
    evidence: https://docs.snowflake.com/en/sql-reference/functions/system_allowlist
    vendor_position: "Deployment-specific hostnames/IPs per account; no global list."
  - slug: mongodb-atlas
    name: MongoDB Atlas (data plane)
    evidence: https://www.mongodb.com/docs/atlas/reference/faq/networking/
    vendor_position: "Cluster IPs are per-project/dynamic; control-plane IPs only via authenticated Admin API. Vendor directs users to private endpoints (PrivateLink)."
  - slug: vercel
    name: Vercel (function egress)
    evidence: https://vercel.com/docs/networking/static-ips
    vendor_position: "Dynamic by default; static IPs are a paid per-customer feature, not a public range."
  - slug: netlify
    name: Netlify (function egress)
    evidence: https://docs.netlify.com/manage/security/private-connectivity/
    vendor_position: "States that by default the addresses builds and functions connect from 'will fluctuate when we scale up and down'. A static set is available only through the Private Connectivity add-on on Enterprise plans."
  - slug: openai-api
    name: OpenAI API (api.openai.com)
    evidence: https://www.cloudflare.com/ips/
    vendor_position: "api.openai.com resolves into Cloudflare's published ranges (verified 2026-07-30: 172.66.0.243 within 172.64.0.0/13, 162.159.140.245 within 162.158.0.0/15), so pinning it would allowlist the whole CDN rather than OpenAI."
  - slug: akamai
    name: Akamai (CDN)
    evidence: https://techdocs.akamai.com/site-shield/docs/welcome-site-shield
    vendor_position: "Site Shield issues a per-customer set of IP subnet ranges (a map) retrieved through Akamai Control Center or the Site Shield API, rather than one public global list."
  - slug: box
    name: Box
    evidence: https://support.box.com/hc/en-us/articles/360043696434-Configuring-A-Firewall-For-Box-Applications-and-Services
    vendor_position: "Use domain names; 'IP addresses can change frequently and without notice' (their wording). No webhook source ranges published."
  - slug: sumo-logic
    name: Sumo Logic
    evidence: https://help.sumologic.com/docs/api/getting-started/
    vendor_position: "No own ranges; directs users to download the AWS IP ranges JSON and use the prefixes for the AWS region their deployment sits in, which the aws service already covers. States plainly that 'the list of IP ranges is shared infrastructure. It is not limited to Sumo Logic nodes and is subject to change over time.'"
  - slug: netsuite
    name: Oracle NetSuite (platform)
    evidence: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_N251955.html
    vendor_position: "States plainly that Oracle 'does not support the use of NetSuite IP addresses to access or manage access to any NetSuite services', that outbound addresses are 'not documented in the NetSuite Help Center or in SuiteAnswers', and that *.netsuite.com is CDN-fronted. Directs users to 2FA, token-based auth and OAuth 2.0 instead, or to a DNS lookup on outboundips.netsuite.com. NetSuite Connector IS published, see the netsuite-connector service."
  - slug: confluent
    name: Confluent Cloud
    evidence: https://docs.confluent.io/cloud/current/networking/static-egress-ip-addresses.html
    vendor_position: "Public egress addresses are read from the Cloud Console or the authenticated Cloud REST API (api.confluent.cloud/networking/v1/ip-addresses), are shared by every customer in the same cloud and region, and are 'not guaranteed to be static' (their wording)."
  - slug: palo-alto
    name: Palo Alto Networks Prisma Access
    evidence: https://docs.paloaltonetworks.com/prisma-access/administration/prisma-access-setup/retrieve-ip-addresses-for-prisma-access
    vendor_position: "Egress addresses are allocated per tenant and retrieved with your own API key from api.prod.datapath.prismaaccess.com, or read per location in the Prisma Access UI."
  - slug: splunk-cloud
    name: Splunk Cloud Platform
    evidence: https://help.splunk.com/en?resourceId=SplunkCloud_Config_ConfigureIPAllowList
    vendor_position: "The documented control is an IP allow list restricting which addresses on your own network reach each Splunk feature, managed through the Admin Config Service API. Splunk publishes no ranges of its own for the stack."
  - slug: cockroachdb
    name: CockroachDB Cloud
    evidence: https://www.cockroachlabs.com/docs/cockroachcloud/network-authorization
    vendor_position: "The documented controls are an allowlist of your own authorized networks and private connectivity through AWS PrivateLink, GCP Private Service Connect or Azure Private Link."
  - slug: redis-cloud
    name: Redis Cloud
    evidence: https://redis.io/docs/latest/operate/rc/security/cidr-whitelist/
    vendor_position: "The CIDR allow list restricts which of your own addresses may reach your database, between 4 and 32 entries depending on plan. Redis publishes no ranges of its own."
  - slug: aiven
    name: Aiven
    evidence: https://aiven.io/docs/platform/concepts/static-ips
    vendor_position: "Services are addressed by hostname; static IP addresses are a paid per-project resource created and attached with the avn static-ip CLI, not a public range list."
  - slug: supabase
    name: Supabase
    evidence: https://supabase.com/docs/guides/platform/ipv4-address
    vendor_position: "States that 'IPv4 addresses are guaranteed to be static for ingress traffic' through a per-project paid add-on, while 'the outbound IP address is not static and cannot be guaranteed'."
  - slug: planetscale
    name: PlanetScale
    evidence: https://planetscale.com/docs/imports/import-tool-migration-addresses
    vendor_position: "The addresses to allowlist are shown in the console during the import workflow, differ by region, and the vendor directs users to read them there each time because they 'can change occasionally'."
  - slug: docker-hub
    name: Docker Hub / Docker Desktop
    evidence: https://docs.docker.com/desktop/setup/allow-list/
    vendor_position: "Publishes an allowlist of domain URLs rather than addresses; the page lists hostnames only. Reproducible on the data plane: registry-1.docker.io resolves into rotating AWS us-east-1 EC2 addresses, a different set on each query (verified 2026-07-30)."
  - slug: mailchimp-mandrill
