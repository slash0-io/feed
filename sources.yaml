    cadence: "irregular; self-published RFC 8805 geofeed"
    endpoints:
      - id: geofeed
        url: https://www.digitalocean.com/geo/google.csv
        format: geofeed-csv            # cidr,country,region,city,postal
        detection: {poll: hash}        # no cache headers (verified)
        purposes:
          - {key: all, direction: egress, select: "*"}
    verified: "2026-07-04"

  - slug: ibm-cloud
    name: IBM Cloud (Classic infrastructure)
    category: cloud
    classification: dedicated
    provenance: https://cloud.ibm.com/docs/infrastructure-hub?topic=infrastructure-hub-ibm-cloud-ip-ranges
    cadence: "irregular; page carries an in-page change log"
    notes: >
      Classic-infrastructure ranges only (no published VPC set). Front-end = public
      network of classic data centers; load balancer IPs published separately. The page's
      back-end/service-network sections are RFC1918 space — normalization drops private
      ranges by design so those sections are not selectable purposes. Page moved from
      docs/cloud-infrastructure to docs/infrastructure-hub (old URL 410s, 2026-07-11).
    endpoints:
      - id: docs
        url: https://cloud.ibm.com/docs/infrastructure-hub?topic=infrastructure-hub-ibm-cloud-ip-ranges
        format: html-cidr-extract
        detection: {poll: docs-page}
        purposes:
          - {key: frontend,       direction: egress, select: "section=Front-end (public) network"}
          - {key: load-balancers, direction: egress, select: "section=Load balancer IPs"}
    verified: "2026-07-11"

  - slug: linode
    name: Akamai Connected Cloud (Linode)
