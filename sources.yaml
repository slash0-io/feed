# Machine registry of upstream IP-range sources, consumed by the feed generator.
#
# Every `endpoints[].url` in this file was fetched and verified live on the date in
# `verified`. Human-readable research, evidence, and methodology: research/SOURCES.md
#
# Field reference:
#   classification: dedicated   = vendor-owned ranges, safe to pin in IP allowlists
#                   mixed       = some purposes dedicated, others shared/dynamic
#                   cdn-shared  = fronted by shared CDN ranges; IP pinning is leaky (do not publish as pinnable)
#   direction:      egress      = ranges you connect TO (destination allowlists / SG egress)
#                   ingress     = ranges they connect FROM (webhook sources / SG ingress)
#   detection.poll: cond-get    = server honors If-None-Match / If-Modified-Since (verified 304)
#                   hash        = no cache headers; fetch + content-hash compare
#                   docs-page   = HTML page; extract CIDRs, hash the extracted set
#   detection.push: optional out-of-band change signal (subscribe in addition to polling)
#   detection.push_kind: vendor    = a signal the vendor operates (topic, status page, version endpoint)
#                        docs-repo = commit feed on the public repo behind their docs page (derived, not offered)
#   notice:         advance warning the vendor commits to before newly published ranges carry
#                   traffic; set only where the vendor documents a period
#   notice_evidence / detection.push_evidence: REQUIRED alongside notice / push. The vendor page
#                   stating the claim. Every public claim about a named vendor cites its source.

schema_version: 1

defaults:
  poll_interval_seconds:
    cond-get: 60      # a 304 costs ~200 bytes; poll aggressively
    hash: 300
    docs-page: 900

services:
  # ── Cloud / IaaS ──────────────────────────────────────────────────────────
  - slug: aws
    name: Amazon Web Services
    category: cloud
    classification: dedicated
    provenance: https://docs.aws.amazon.com/vpc/latest/userguide/aws-ip-ranges.html
    cadence: "irregular, several changes per week (observed); every publish signaled via SNS"
    endpoints:
      - id: main
        url: https://ip-ranges.amazonaws.com/ip-ranges.json
        format: aws-ip-ranges          # {syncToken, createDate, prefixes[], ipv6_prefixes[]}
        detection:
          poll: cond-get
          push: "SNS arn:aws:sns:us-east-1:806199016981:AmazonIpSpaceChanged (us-east-1 subscription required)"
          push_kind: vendor
          push_evidence: https://docs.aws.amazon.com/vpc/latest/userguide/subscribe-notifications.html
        purposes:
          - {key: all,        direction: egress, select: "*"}
          - {key: s3,         direction: egress, select: "service=S3"}
          - {key: dynamodb,   direction: egress, select: "service=DYNAMODB"}
          - {key: cloudfront, direction: egress, select: "service=CLOUDFRONT"}
          - {key: route53-healthchecks, direction: ingress, select: "service=ROUTE53_HEALTHCHECKS"}
    verified: "2026-07-04"

  - slug: google-cloud
    name: Google Cloud Platform
    category: cloud
    classification: dedicated
    provenance: https://knowledge.workspace.google.com/admin/security/obtain-google-ip-address-ranges
    cadence: "regenerated frequently (roughly daily); syncToken/creationTime in file"
    endpoints:
      - id: cloud
        url: https://www.gstatic.com/ipranges/cloud.json
        format: google-prefixes        # {syncToken, creationTime, prefixes[{ipv4Prefix|ipv6Prefix, scope, service}]}
        detection: {poll: cond-get}
        purposes:
          - {key: all, direction: egress, select: "*"}
    verified: "2026-07-04"

  - slug: google
    name: Google (all services)
    category: cloud
    classification: dedicated
    provenance: https://knowledge.workspace.google.com/admin/security/obtain-google-ip-address-ranges
    cadence: "regenerated frequently (roughly daily)"
    notes: >
      goog.json is the superset of all Google netblocks. Google publishes exactly two
      files, goog.json and cloud.json, and documents the derivation for everything else:
      "To obtain the net list of default domain IP ranges, subtract the ranges in the
      second list from the ranges in the first list." Google Workspace is therefore not a
      separate publication, it is goog minus cloud, which is why there is no
      google-workspace service. Computing that purpose here would need cross-endpoint set
      subtraction, which the generator does not have; see the README roadmap.
    endpoints:
      - id: goog
        url: https://www.gstatic.com/ipranges/goog.json
        format: google-prefixes
        detection: {poll: cond-get}
        purposes:
          - {key: all, direction: egress, select: "*"}
    verified: "2026-07-04"

  - slug: azure
    name: Microsoft Azure (Service Tags)
    category: cloud
    classification: dedicated
    provenance: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
    cadence: "weekly publication; new IPs unused for >=1 week after publication (documented grace window)"
    notice: "1 week before new IPs are used"
    notice_evidence: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
    notes: >
      Weekly ServiceTags_Public_YYYYMMDD.json; per-tag changeNumber for diffing. The download
      URL rotates weekly behind a confirmation page (id=56519), so the fetcher must resolve the
      current URL from the download-page HTML or use the authenticated Service Tag Discovery API.
    endpoints:
      - id: service-tags
        url: https://www.microsoft.com/en-us/download/details.aspx?id=56519
        format: azure-service-tags     # fetcher resolves the rotating JSON URL from this page, then {values[{name, properties.addressPrefixes}]}
        detection: {poll: docs-page}
        purposes:
          - {key: all,     direction: egress, select: "tag=AzureCloud"}
          - {key: storage, direction: egress, select: "tag=Storage"}
          - {key: sql,     direction: egress, select: "tag=Sql"}
    verified: "2026-07-10"

  - slug: microsoft-365
    name: Microsoft 365
    category: business-saas
    classification: mixed
    provenance: https://learn.microsoft.com/en-us/microsoft-365/enterprise/microsoft-365-ip-web-service
    cadence: "monthly planned (start of month) plus out-of-band; /version endpoint is the purpose-built change signal"
    notice: "30 days before new endpoints are used"
    notice_evidence: https://learn.microsoft.com/en-us/microsoft-365/enterprise/microsoft-365-ip-web-service?view=o365-worldwide
    endpoints:
      - id: worldwide
        url: https://endpoints.office.com/endpoints/worldwide?clientrequestid=<uuid>
        format: o365-endpoints         # array of {serviceArea, ips[], urls[], category, required}
        detection:
          poll: hash
          push: "poll https://endpoints.office.com/version (tiny response; version string bumps on change)"
          push_kind: vendor
          push_evidence: https://learn.microsoft.com/en-us/microsoft-365/enterprise/microsoft-365-ip-web-service?view=o365-worldwide
        purposes:
          - {key: exchange,   direction: egress, select: "serviceArea=Exchange"}
          - {key: sharepoint, direction: egress, select: "serviceArea=SharePoint"}
          - {key: teams,      direction: egress, select: "serviceArea=Skype"}
          - {key: common,     direction: egress, select: "serviceArea=Common"}
    verified: "2026-07-04"

  - slug: oracle-cloud
    name: Oracle Cloud Infrastructure
    category: cloud
    classification: dedicated
    provenance: https://docs.oracle.com/en-us/iaas/Content/General/Concepts/addressranges.htm
    cadence: "irregular; last_updated_timestamp in file"
    endpoints:
      - id: main
        url: https://docs.oracle.com/en-us/iaas/tools/public_ip_ranges.json
        format: oci-ranges             # {last_updated_timestamp, regions[{region, cidrs[{cidr, tags[]}]}]}
        detection: {poll: cond-get}
        purposes:
          - {key: all,          direction: egress, select: "*"}
          - {key: object-storage, direction: egress, select: "tag=OBJECT_STORAGE"}
    verified: "2026-07-04"

  - slug: digitalocean
    name: DigitalOcean
    category: cloud
    classification: dedicated
    provenance: https://www.digitalocean.com/geo/google.csv
    cadence: "irregular; self-published RFC 8805 geofeed"
    endpoints:
      - id: geofeed
        url: https://www.digitalocean.com/geo/google.csv
        format: geofeed-csv            # cidr,country,region,city,postal
        detection: {poll: hash}        # no cache headers (verified)
        purposes:
          - {key: all, direction: egress, select: "*"}
    verified: "2026-07-04"

  - slug: ibm-cloud
    name: IBM Cloud (Classic infrastructure)
    category: cloud
    classification: dedicated
    provenance: https://cloud.ibm.com/docs/infrastructure-hub?topic=infrastructure-hub-ibm-cloud-ip-ranges
    cadence: "irregular; page carries an in-page change log"
    notes: >
      Classic-infrastructure ranges only (no published VPC set). Front-end = public
      network of classic data centers; load balancer IPs published separately. The page's
      back-end/service-network sections are RFC1918 space, and normalization drops private
      ranges by design so those sections are not selectable purposes. Page moved from
      docs/cloud-infrastructure to docs/infrastructure-hub (old URL 410s, 2026-07-11).
    endpoints:
      - id: docs
        url: https://cloud.ibm.com/docs/infrastructure-hub?topic=infrastructure-hub-ibm-cloud-ip-ranges
        format: html-cidr-extract
        detection: {poll: docs-page}
        purposes:
          - {key: frontend,       direction: egress, select: "section=Front-end (public) network"}
          - {key: load-balancers, direction: egress, select: "section=Load balancer IPs"}
    verified: "2026-07-11"

  - slug: linode
    name: Akamai Connected Cloud (Linode)
    category: cloud
    classification: dedicated
    provenance: https://geoip.linode.com/
    cadence: "irregular; 'Last modified' comment in feed; RFC 8805 geofeed"
    endpoints:
      - id: geofeed
        url: https://geoip.linode.com/
        format: geofeed-csv
        detection: {poll: cond-get}
        purposes:
          - {key: all, direction: egress, select: "*"}
    verified: "2026-07-04"

  # ── CDN / edge ────────────────────────────────────────────────────────────
  - slug: cloudflare
    name: Cloudflare
    category: cdn
    classification: cdn-shared
    provenance: https://www.cloudflare.com/ips/
    cadence: "rare; new ranges staged on the list before production use (documented)"
    notes: "Shared edge ranges. Publishing these as 'pinnable' for a Cloudflare-fronted SaaS would allowlist the entire CDN, so it is surfaced in the feed as cdn-shared and consumers can make that call explicitly."
    endpoints:
      - id: api
        url: https://api.cloudflare.com/client/v4/ips
        format: cloudflare-api         # {result:{ipv4_cidrs[], ipv6_cidrs[], etag}}
        detection: {poll: cond-get}    # response includes its own etag field too
        purposes:
          - {key: edge, direction: both, select: "*"}
    verified: "2026-07-04"

  - slug: fastly
    name: Fastly
    category: cdn
    classification: cdn-shared
    provenance: https://www.fastly.com/documentation/reference/api/utils/public-ip-list/
    cadence: "rare; changes announced in advance on the Fastly status page (subscribable)"
    endpoints:
      - id: public-ip-list
        url: https://api.fastly.com/public-ip-list
        format: fastly-list            # {addresses[], ipv6_addresses[]}
        detection:
          poll: hash                   # no cache headers (verified)
          push: "fastlystatus.com subscription ('IP address announcement' category)"
          push_kind: vendor
          push_evidence: https://www.fastly.com/documentation/reference/api/utils/public-ip-list/
        purposes:
          - {key: edge, direction: both, select: "*"}
    verified: "2026-07-04"

  # ── Developer platforms / CI ──────────────────────────────────────────────
  - slug: github
    name: GitHub
    category: devtools
    classification: dedicated
    provenance: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-githubs-ip-addresses
    cadence: "occasional; major changes announced on the GitHub changelog blog"
    endpoints:
      - id: meta
        url: https://api.github.com/meta
        format: github-meta            # {hooks[], web[], api[], git[], pages[], actions[], importer[], dependabot[]}
        detection: {poll: cond-get}
        purposes:
          - {key: api,       direction: egress,  select: "api"}
          - {key: git,       direction: egress,  select: "git"}
          - {key: web,       direction: egress,  select: "web"}
          - {key: pages,     direction: egress,  select: "pages"}
          - {key: hooks,     direction: ingress, select: "hooks"}
          - {key: actions,   direction: ingress, select: "actions"}
          - {key: packages,  direction: egress,  select: "packages"}
    verified: "2026-07-04"

  - slug: gitlab
    name: GitLab.com
    category: devtools
    classification: mixed
    provenance: https://docs.gitlab.com/user/gitlab_com/
    cadence: "stable dedicated ranges for web/API; runners have NO static IPs (documented)"
    notes: "34.74.90.64/28 and 34.74.226.0/24 solely allocated to GitLab (web/API/webhooks/mirroring). Docs are open source: watch the docs repo file via commit feed for near-instant change detection."
    endpoints:
      - id: docs
        url: https://docs.gitlab.com/user/gitlab_com/
        format: html-cidr-extract
        detection:
          poll: docs-page
          push: "gitlab.com/gitlab-org/gitlab commits atom feed for doc/user/gitlab_com/_index.md"
          push_kind: docs-repo
          push_evidence: https://gitlab.com/gitlab-org/gitlab/-/raw/master/doc/user/gitlab_com/_index.md
        purposes:
          - {key: web-api,  direction: egress,  select: "section=IP range"}
          - {key: webhooks, direction: ingress, select: "section=IP range"}   # same ranges; webhook + mirroring sources
    verified: "2026-07-10"

  - slug: circleci
    name: CircleCI
    category: devtools
    classification: dedicated
    provenance: https://circleci.com/docs/guides/security/ip-ranges/
    cadence: "irregular; list is small (~30 IPs); feature requires Performance/Scale plan on the job side"
    notice: "30 days"
    notice_evidence: https://circleci.com/docs/guides/security/ip-ranges/
    endpoints:
      - id: jobs
        url: https://circleci.com/docs/ip-ranges-list.json
        format: circleci-list          # {IPRanges: {jobs: [], core: [], macOS: []}}
        detection:
          poll: hash                   # no cache headers (verified)
          push: "email to customers with a job opted into the IP ranges feature"
          push_kind: vendor
          push_evidence: https://circleci.com/docs/guides/security/ip-ranges/
        purposes:
          - {key: jobs, direction: ingress, select: "jobs"}   # CI jobs reaching YOUR systems
          - {key: core, direction: egress,  select: "core"}   # CircleCI cloud service IPs
    verified: "2026-07-04"

  - slug: buildkite
    name: Buildkite
    category: devtools
    classification: dedicated
    provenance: https://buildkite.com/docs/apis/rest-api/meta
    cadence: "irregular; docs recommend daily checks; new addresses advertised >=7 days before use (documented)"
    notice: "7 days, vendor says it will try"
    notice_evidence: https://buildkite.com/docs/apis/rest-api/meta
    notes: "Unauthenticated meta API. webhook_ips = sources of webhooks and commit statuses Buildkite sends you."
    endpoints:
      - id: meta
        url: https://api.buildkite.com/v2/meta
        format: json-cidr-map          # {"webhook_ips": ["ip", ...]}
        detection: {poll: cond-get}    # ETag honored (verified 304)
        purposes:
          - {key: webhooks, direction: ingress, select: "webhook_ips"}
    verified: "2026-07-10"

  - slug: launchdarkly
    name: LaunchDarkly
    category: devtools
    classification: dedicated
    provenance: https://launchdarkly.com/docs/home/infrastructure/ip-list
    cadence: "irregular; changes posted to the status page ahead of taking effect"
    notice: "2 weeks, posted on the status page"
    notice_evidence: https://launchdarkly.com/docs/home/infrastructure/ip-list
    notes: >
      Direction is split and the vendor states each one explicitly. `addresses` are where
      "these IP addresses receive HTTPS connections your SDKs initiate through port 443",
      so an SDK reaching LaunchDarkly is egress. `outboundAddresses` are what
      "LaunchDarkly uses when making calls to your network", so webhooks and integrations
      are ingress. The notice is qualified by the vendor: "in certain exceptional
      circumstances the notification window may be shorter".
    endpoints:
      - id: api
        url: https://app.launchdarkly.com/api/v2/public-ip-list
        format: json-cidr-map          # {"addresses": [...], "outboundAddresses": [...]}
        detection:
          poll: hash                   # no ETag or Last-Modified (verified)
          push: "status.launchdarkly.com posts IP list changes ahead of the change"
          push_kind: vendor
          push_evidence: https://launchdarkly.com/docs/home/infrastructure/ip-list
        purposes:
          - {key: service,  direction: egress,  select: "addresses"}
          - {key: webhooks, direction: ingress, select: "outboundAddresses"}
    verified: "2026-07-30"

  # ── Payments / fintech ────────────────────────────────────────────────────
  - slug: stripe
    name: Stripe
    category: payments
    classification: dedicated
    provenance: https://docs.stripe.com/ips
    cadence: "irregular; Stripe documents advance notice for webhook IP changes"
    notice: "7 days, by mailing list"
    notice_evidence: https://docs.stripe.com/ips
    endpoints:
      - id: api
        url: https://stripe.com/files/ips/ips_api.json
        format: stripe-list            # {"API": [bare IPs]} -> normalize to /32
        detection:
          poll: hash                   # no cache headers (verified)
          push: "stripe.com/ips mailing list (seven days notice before changes)"
          push_kind: vendor
          push_evidence: https://docs.stripe.com/ips
        purposes:
          - {key: api, direction: egress, select: "*"}
      - id: webhooks
        url: https://stripe.com/files/ips/ips_webhooks.json
        format: stripe-list            # {"WEBHOOKS": [...]}
        detection: {poll: hash}
        purposes:
          - {key: webhooks, direction: ingress, select: "*"}
      - id: terminal
        url: https://stripe.com/files/ips/ips_armada_gator.json
        format: stripe-list            # {"ARMADA_GATOR": [...]} (Stripe Terminal)
        detection: {poll: hash}
        purposes:
          - {key: terminal, direction: egress, select: "*"}
    verified: "2026-07-04"

  - slug: braintree
    name: Braintree (PayPal)
    category: payments
    classification: dedicated
    provenance: https://developer.paypal.com/braintree/docs/reference/general/braintree-ip-addresses
    cadence: "irregular; docs explicitly say 'watch for changes in ips.json'"
    endpoints:
      - id: ips
        url: https://assets.braintreegateway.com/json/ips.json
        format: braintree-ips          # {production:{...}, sandbox:{...}}
        detection: {poll: hash}
        purposes:
          - {key: api,     direction: egress, select: "production"}
          - {key: sandbox, direction: egress, select: "sandbox"}
    verified: "2026-07-04"

  - slug: plaid
    name: Plaid
    category: payments
    classification: dedicated
    provenance: https://plaid.com/docs/api/webhooks/
    cadence: "rare; four static webhook source IPs; 'subject to change' (documented)"
    notes: >
      Webhook source IPs only (Plaid POSTing to your webhook URL). The API destination is
      not IP-pinned; Plaid documents JWT webhook verification alongside allowlisting.
    endpoints:
      - id: docs
        url: https://plaid.com/docs/api/webhooks/
        format: html-cidr-extract
        detection: {poll: docs-page}
        purposes:
          - {key: webhooks, direction: ingress, select: "section=Configuring webhooks"}
    verified: "2026-07-11"

  - slug: checkout-com
    name: Checkout.com
    category: payments
    classification: mixed
    provenance: https://www.checkout.com/docs/developer-resources/ip-addresses
    cadence: "irregular; page carries a 'Last updated' date, February 15 2023 as of the verified date"
    notes: >
      Webhook sources only. The API list on the same page is Fastly-fronted: 19 of its 43
      distinct entries are exactly Fastly's published ranges, each one verified as a subnet
      of api.fastly.com/public-ip-list on 2026-07-30, so pinning the API would allow every
      other site behind that CDN. The four machine-readable .txt files the page advertises
      under "Retrieve IP address lists" all return 404 on both checkout.com and
      www.checkout.com (verified 2026-07-30), which is why this reads the page itself. The
      page does honour If-None-Match with a stable ETag, but the tag covers the whole
      document rather than the lists, so detection stays a hash of the extracted set.
    endpoints:
      - id: docs
        url: https://www.checkout.com/docs/developer-resources/ip-addresses
        format: html-cidr-extract
        detection: {poll: docs-page}
        purposes:
          - {key: webhooks, direction: ingress, select: "section=Receive webhook notifications"}
    verified: "2026-07-30"

  - slug: wise
    name: Wise
    category: payments
    classification: dedicated
    provenance: https://docs.wise.com/api-docs/features/webhooks-notifications
    cadence: "irregular; no version marker on the page"
    notes: >
      Wise documents two representations of the same production senders and they are not
      equivalent. The preferred form is two /24s, while the "if you can't allowlist a /24"
      alternative adds six AWS eu-central-1 addresses that sit outside both. The published
      production purpose is the union of the two, so an allowlist built from it satisfies
      either reading. Wise states that individual IPs "can change and have a lower
      reliability SLO", and that IP allowlisting should not be the only control.
    endpoints:
      - id: docs
        url: https://docs.wise.com/api-docs/features/webhooks-notifications
        format: html-cidr-extract
        detection: {poll: docs-page}
        purposes:
          - {key: webhooks,         direction: ingress, select: "section=Production"}
          - {key: webhooks-sandbox, direction: ingress, select: "section=Sandbox"}
    verified: "2026-07-30"

