# ── Services that do NOT publish pinnable ranges ─────────────────────────────
# Verified vendor positions. These are surfaced in the feed as `pinnable: false`
# with the vendor's recommended alternative — the honest-catalog differentiator.
non_publishers:
  - slug: twilio
    name: Twilio (REST API + webhooks)
    evidence: https://support.twilio.com/hc/en-us/articles/115015934048-All-About-Twilio-IP-Addresses
    vendor_position: "IPs 'highly dynamic, span a large range'; allow *.twilio.com instead. SIP trunking/media DO have published ranges (candidate for a narrow sip purpose later)."
  - slug: adyen
    name: Adyen
    evidence: https://help.adyen.com/knowledge/ecommerce-integrations/webhooks/what-ip-addresses-does-adyen-use-to-send-webhook-events
    vendor_position: "No IP list; allowlist out.adyen.com or resolve it via DNS hourly (their words)."
  - slug: sendgrid
    name: SendGrid (webhooks/parse)
    evidence: https://support.sendgrid.com/hc/en-us/articles/44375457225371
    vendor_position: "Dynamic cloud infra; use signed webhooks, not IP allowlists."
  - slug: slack
    name: Slack
    evidence: https://docs.slack.dev/concepts/security/
    vendor_position: "No published egress IPs; their allowlisting feature restricts YOUR IPs calling THEM."
  - slug: shopify
    name: Shopify (webhooks)
    evidence: "Shopify community threads; no official ranges page"
    vendor_position: "Webhook source IPs not published; verify HMAC signatures instead."
  - slug: duo
    name: Duo Security
    evidence: https://duo.com/docs (KB 1337)
    vendor_position: "Explicitly discourages IP-based egress rules; may change to maintain availability."
  - slug: snowflake
    name: Snowflake
    evidence: "SYSTEM$ALLOWLIST() function docs"
    vendor_position: "Deployment-specific hostnames/IPs per account; no global list."
  - slug: mongodb-atlas
    name: MongoDB Atlas (data plane)
    evidence: https://www.mongodb.com/docs/atlas/reference/faq/networking/
    vendor_position: "Cluster IPs are per-project/dynamic; control-plane IPs only via authenticated Admin API. Use private endpoints (PrivateLink) — which is itself the strategy's Tier-2 story."
  - slug: vercel
    name: Vercel (function egress)
    evidence: https://vercel.com/docs/networking/static-ips
    vendor_position: "Dynamic by default; static IPs are a paid per-customer feature, not a public range."
  - slug: netlify
    name: Netlify (function egress)
    evidence: "Netlify support/community; runs on AWS Lambda"
    vendor_position: "No published IPs; any circulating list 'is a guess or outdated'."
  - slug: hubspot
    name: HubSpot
    evidence: https://developers.hubspot.com/docs/api-reference (ip-ranges guide)
    vendor_position: "No static publication ('change too frequently'); offers an API returning current ranges — could be integrated later as an authed source."
  - slug: openai-api
    name: OpenAI API (api.openai.com)
    evidence: "Cloudflare-fronted endpoint; no inbound range publication"
    vendor_position: "Egress to api.openai.com resolves to shared Cloudflare ranges — pinning would allowlist the whole CDN."
  - slug: akamai
    name: Akamai (CDN)
    evidence: "Site Shield / Origin IP ACL docs (auth required)"
    vendor_position: "Customer-specific maps behind login; no public global ranges."

