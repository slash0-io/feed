    vendor_position: "Directs users to authenticate that a webhook originated from Mailchimp's servers using the documented request-signature flow. The /ips/ API returns your own dedicated sending addresses, which is a different thing from webhook sources."
  - slug: honeycomb
    name: Honeycomb
    evidence: https://docs.honeycomb.io/security-compliance/security-data-protection/
