  - slug: hubspot
    name: HubSpot
    category: business-saas
    classification: dedicated
    provenance: https://developers.hubspot.com/docs/api-reference/2026-09-beta/account/ip-ranges/guide
    cadence: "vendor states the returned ranges change over time and asks consumers to re-fetch regularly"
    notes: >
      Reclassified 2026-07-30 from non-publisher to publisher. HubSpot now serves
      an unauthenticated JSON endpoint of its network origins; the previous record
      that this was available only to authenticated callers was wrong.
      DIRECTION: every entry is tagged EGRESS in HubSpot's own vocabulary, meaning
      traffic leaving HubSpot. From the customer's point of view those addresses
      connect IN, so all purposes here are ingress. Reading HubSpot's label
      literally would put these in egress rules, where they would match traffic a
      workload never sends.
      HubSpot publishes only its outbound addresses. The destination ranges for
      api.hubapi.com are still not published, so this does not help anyone trying
      to restrict egress TO HubSpot; that side remains unpinnable by address.
      The endpoint path carries a beta marker and HubSpot flags the feature as
      beta, so treat a 404 here as a vendor move rather than an outage.
      No ETag or Last-Modified, so detection is a content hash. IPv4 only.
    endpoints:
      - id: ranges
        url: https://api.hubapi.com/meta/network-origins/2026-09-beta/ip-ranges
        format: hubspot-ranges
        detection: {poll: hash}
        purposes:
          - {key: api,      direction: ingress, select: "service=API"}
          - {key: email,    direction: ingress, select: "service=EMAIL"}
          - {key: crawlers, direction: ingress, select: "service=WEB_SCRAPING"}
          - {key: dns,      direction: ingress, select: "service=DNS"}
    verified: "2026-07-30"

