  # ── CDN / edge ────────────────────────────────────────────────────────────
  - slug: cloudflare
    name: Cloudflare
    category: cdn
    classification: cdn-shared
    provenance: https://www.cloudflare.com/ips/
    cadence: "rare; new ranges staged on the list before production use (documented)"
    notes: "Shared edge ranges. Publishing these as 'pinnable' for a Cloudflare-fronted SaaS would allowlist the entire CDN — surfaced in the feed as cdn-shared so consumers can make that call explicitly."
    endpoints:
      - id: api
        url: https://api.cloudflare.com/client/v4/ips
        format: cloudflare-api         # {result:{ipv4_cidrs[], ipv6_cidrs[], etag}}
        detection: {poll: cond-get}    # response includes its own etag field too
        purposes:
          - {key: edge, direction: both, select: "*"}
    verified: "2026-07-04"

  - slug: fastly
    name: Fastly
    category: cdn
    classification: cdn-shared
    provenance: https://www.fastly.com/documentation/reference/api/utils/public-ip-list/
    cadence: "rare; changes announced in advance on the Fastly status page (subscribable)"
    endpoints:
      - id: public-ip-list
        url: https://api.fastly.com/public-ip-list
        format: fastly-list            # {addresses[], ipv6_addresses[]}
        detection:
          poll: hash                   # no cache headers (verified)
          push: "fastlystatus.com subscription ('IP address announcement' category)"
          push_kind: vendor
          push_evidence: https://www.fastly.com/documentation/reference/api/utils/public-ip-list/
        purposes:
          - {key: edge, direction: both, select: "*"}
    verified: "2026-07-04"

