    endpoints:
      - id: main
        url: https://docs.oracle.com/en-us/iaas/tools/public_ip_ranges.json
        format: oci-ranges             # {last_updated_timestamp, regions[{region, cidrs[{cidr, tags[]}]}]}
        detection: {poll: cond-get}
        purposes:
          - {key: all,          direction: egress, select: "*"}
          - {key: object-storage, direction: egress, select: "tag=OBJECT_STORAGE"}
    verified: "2026-07-04"

  - slug: digitalocean
    name: DigitalOcean
    category: cloud
