# Machine registry of upstream IP-range sources — consumed by the feed generator.
#
# Every `endpoints[].url` in this file was fetched and verified live on the date in
# `verified`. Human-readable research, evidence, and methodology: research/SOURCES.md
#
# Field reference:
#   classification: dedicated   = vendor-owned ranges, safe to pin in IP allowlists
#                   mixed       = some purposes dedicated, others shared/dynamic
#                   cdn-shared  = fronted by shared CDN ranges; IP pinning is leaky (do not publish as pinnable)
#   direction:      egress      = ranges you connect TO (destination allowlists / SG egress)
#                   ingress     = ranges they connect FROM (webhook sources / SG ingress)
#   detection.poll: cond-get    = server honors If-None-Match / If-Modified-Since (verified 304)
#                   hash        = no cache headers; fetch + content-hash compare
#                   docs-page   = HTML page; extract CIDRs, hash the extracted set
#   detection.push: optional out-of-band change signal (subscribe in addition to polling)
#   detection.push_kind: vendor    = a signal the vendor operates (topic, status page, version endpoint)
#                        docs-repo = commit feed on the public repo behind their docs page (derived, not offered)
#   notice:         advance warning the vendor commits to before newly published ranges carry
#                   traffic; set only where the vendor documents a period
#   notice_evidence / detection.push_evidence: REQUIRED alongside notice / push. The vendor page
#                   stating the claim. Every public claim about a named vendor cites its source.

schema_version: 1

defaults:
  poll_interval_seconds:
    cond-get: 60      # a 304 costs ~200 bytes; poll aggressively
    hash: 300
    docs-page: 900

services:
  # ── Cloud / IaaS ──────────────────────────────────────────────────────────
  - slug: aws
    name: Amazon Web Services
    category: cloud
    classification: dedicated
    provenance: https://docs.aws.amazon.com/vpc/latest/userguide/aws-ip-ranges.html
    cadence: "irregular, several changes per week (observed); every publish signaled via SNS"
    endpoints:
      - id: main
        url: https://ip-ranges.amazonaws.com/ip-ranges.json
        format: aws-ip-ranges          # {syncToken, createDate, prefixes[], ipv6_prefixes[]}
        detection:
          poll: cond-get
          push: "SNS arn:aws:sns:us-east-1:806199016981:AmazonIpSpaceChanged (us-east-1 subscription required)"
          push_kind: vendor
          push_evidence: https://docs.aws.amazon.com/vpc/latest/userguide/subscribe-notifications.html
        purposes:
          - {key: all,        direction: egress, select: "*"}
          - {key: s3,         direction: egress, select: "service=S3"}
          - {key: dynamodb,   direction: egress, select: "service=DYNAMODB"}
          - {key: cloudfront, direction: egress, select: "service=CLOUDFRONT"}
          - {key: route53-healthchecks, direction: ingress, select: "service=ROUTE53_HEALTHCHECKS"}
    verified: "2026-07-04"

  - slug: google-cloud
    name: Google Cloud Platform
    category: cloud
    classification: dedicated
    provenance: https://support.google.com/a/answer/10026322
    cadence: "regenerated frequently (roughly daily); syncToken/creationTime in file"
    endpoints:
      - id: cloud
        url: https://www.gstatic.com/ipranges/cloud.json
        format: google-prefixes        # {syncToken, creationTime, prefixes[{ipv4Prefix|ipv6Prefix, scope, service}]}
        detection: {poll: cond-get}
        purposes:
          - {key: all, direction: egress, select: "*"}
    verified: "2026-07-04"

  - slug: google
    name: Google (all services)
    category: cloud
    classification: dedicated
    provenance: https://support.google.com/a/answer/10026322
    cadence: "regenerated frequently (roughly daily)"
    notes: "goog.json is the superset of all Google netblocks; Google documents goog-minus-cloud as the set for Google APIs/Workspace default domains."
    endpoints:
      - id: goog
        url: https://www.gstatic.com/ipranges/goog.json
        format: google-prefixes
        detection: {poll: cond-get}
        purposes:
          - {key: all, direction: egress, select: "*"}
    verified: "2026-07-04"

  - slug: azure
    name: Microsoft Azure (Service Tags)
    category: cloud
    classification: dedicated
    provenance: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
    cadence: "weekly publication; new IPs unused for >=1 week after publication (documented grace window)"
    notice: "1 week before new IPs are used"
    notice_evidence: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
    notes: >
      Weekly ServiceTags_Public_YYYYMMDD.json; per-tag changeNumber for diffing. The download
      URL rotates weekly behind a confirmation page (id=56519), so the fetcher must resolve the
      current URL from the download-page HTML or use the authenticated Service Tag Discovery API.
    endpoints:
      - id: service-tags
        url: https://www.microsoft.com/en-us/download/details.aspx?id=56519
        format: azure-service-tags     # fetcher resolves the rotating JSON URL from this page, then {values[{name, properties.addressPrefixes}]}
        detection: {poll: docs-page}
        purposes:
          - {key: all,     direction: egress, select: "tag=AzureCloud"}
          - {key: storage, direction: egress, select: "tag=Storage"}
          - {key: sql,     direction: egress, select: "tag=Sql"}
    verified: "2026-07-10"

  - slug: microsoft-365
    name: Microsoft 365
    category: business-saas
    classification: mixed
    provenance: https://learn.microsoft.com/en-us/microsoft-365/enterprise/microsoft-365-ip-web-service
    cadence: "monthly planned (start of month) plus out-of-band; /version endpoint is the purpose-built change signal"
    notice: "30 days before new endpoints are used"
    notice_evidence: https://learn.microsoft.com/en-us/microsoft-365/enterprise/microsoft-365-ip-web-service
    endpoints:
      - id: worldwide
        url: https://endpoints.office.com/endpoints/worldwide?clientrequestid=<uuid>
        format: o365-endpoints         # array of {serviceArea, ips[], urls[], category, required}
        detection:
          poll: hash
          push: "poll https://endpoints.office.com/version (tiny response; version string bumps on change)"
          push_kind: vendor
          push_evidence: https://learn.microsoft.com/en-us/microsoft-365/enterprise/microsoft-365-ip-web-service
        purposes:
          - {key: exchange,   direction: egress, select: "serviceArea=Exchange"}
          - {key: sharepoint, direction: egress, select: "serviceArea=SharePoint"}
          - {key: teams,      direction: egress, select: "serviceArea=Skype"}
          - {key: common,     direction: egress, select: "serviceArea=Common"}
    verified: "2026-07-04"

  - slug: oracle-cloud
