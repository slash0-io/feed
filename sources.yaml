# ── Researched but not yet sourced: candidate backlog (v2+) ─────────────────
backlog:
  # Not published and not parsed: generator/registry.go reads only schema_version,
  # services and non_publishers. This block is a research ledger for humans.
  # Generator features that vendor research surfaced live in the README roadmap,
  # not here, so they get scheduled as engineering work.

  # The vendor publishes a real list and we cannot reach it. These must NEVER be
  # recorded as non-publishers: that would be a false claim about the vendor.
  blocked:
    - slug: crowdstrike
      note: >
        CrowdStrike DOES publish cloud IP addresses and must not be recorded as a
        non-publisher. The document is falcon.<region>.crowdstrike.com/documentation/65/
        cloud-ip-addresses, inside the Falcon console: an anonymous fetch returns a 7.8KB
        "Login | Falcon" page (verified 2026-07-30). No mirror of it exists on the public
        marketing site. Blocked on access, not on vendor policy. Same shape as the duo
        entry below.
    - slug: workday
      note: >
        Network documentation is in Workday Community (community.workday.com), which
        requires a customer login; the article IDs reachable from search 404 anonymously
        (verified 2026-07-30). ready.workday.com/network is only a browser readiness
        test: rendered under headless Chrome it carries no addresses at all.
    - slug: servicenow
      note: >
        Blocked on both access and rendering (verified 2026-07-30). The docs page
        "Define allowed ServiceNow internal IP addresses" renders "Loading application..."
        under headless Chrome with a 25s virtual time budget. The substantive articles
        (KB0598826, KB0538621) are on support.servicenow.com behind a customer login, and
        KB0538621's documented route is a Now Support catalog item, "My IP Information",
        which is per instance and per customer rather than a published list.
    - slug: jfrog
      note: >
        jfrog.com/help/r/... is a Zoomin portal: a plain fetch returns 2.4MB with zero
        addresses and headless Chrome renders 650KB of navigation with no article body
        (verified 2026-07-30). The feature that search surfaces, MyJFrog "IP/CIDR
        Allowlist", restricts which of YOUR addresses reach JFrog, which is the wrong
        direction. Whether a real "JFrog Cloud NAT IPs" list exists is still unknown, so
        this is neither a publisher nor a non-publisher yet.
  # Researched, no public source located, and no vendor page stating a position
  # that could be cited. That missing citation is why they are not non-publishers.
  no_source_found:
    - slug: sentinelone
      note: >
        No public network-requirements document exists on sentinelone.com (checked
        2026-07-30). The substantive docs live on usea1-support.sentinelone.net and
        community.sentinelone.com, both requiring a customer login, so there is no vendor
        page stating a position that could be cited. Deliberately NOT recorded as a
        non-publisher for that reason. Vendor-outreach candidate.
    - slug: segment-amplitude-mixpanel
      note: "no public range documentation found (2026-07-10); segment.com/docs bot-blocks fetches; candidates for vendor outreach."
    - slug: scaleway-ovh-hetzner
      note: "no geofeeds at standard URLs (2026-07-10); announced space visible only via BGP; low priority for SaaS-egress use case."
    - slug: qualys
      note: >
        NOT integrable from platform-identification/ and the earlier note's
        premise was wrong. Re-checked 2026-07-30 with headless Chrome: the page
        renders fine, but it is a platform IDENTIFIER serving hostnames
        (Platform URLs, API URLs, Cloud Agent Servers), not IP ranges. The only
        regex hits are MaxMind GeoIP localStorage keys of the form
        maxmind.geoip2.data.34.141.10.24, which would have published as
        "Qualys scanner ranges" had they not been read in context. A real
        source would be the per-platform KB on success.qualys.com, still
        Salesforce-community JS. Vendor-outreach candidate.
    - slug: iterable
      note: >
        Still blocked, re-verified 2026-07-30: support.iterable.com returns 403
        to a default curl UA and to a Go-http-client UA alike, so the
        non-browser-UA trick that works on IBM Cloud does not help here. The
        403 body itself contains regex-matchable numbers; do not mistake them
        for ranges. Vendor-outreach candidate.
    - slug: ringcentral
      note: >
        Re-checked 2026-07-30. support.ringcentral.com now returns 200 rather
        than blocking, but the network-requirements article carries no IP data
        in the delivered HTML: all 15 regex hits are SVG path coordinates from
        inline icons (fragments like "0 0 1-1.27 2.86 4.83 4.83" match the IPv4
        pattern). So the blocker is missing data, not a fetch problem. Needs a
        page that actually carries the supernets before this is worth revisiting.

  # Product decisions. Do not research these again.
  declined:
    - slug: vonage
      note: >
        DECLINED as a catalog entry (Jason, 2026-07-30): not worth the space. Kept as
        this one line only so it is not researched a fourth time. Do not add it.
